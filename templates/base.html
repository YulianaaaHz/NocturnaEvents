<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ site.site_name }}{% endblock %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>:root{--primary:{{site.primary_color}};--secondary:{{site.secondary_color}};}</style>
</head>
<body>
<div class="stars"></div>
<header class="nav">
  <a class="brand" href="{{ url_for('index') }}"><span class="moon">☾</span><span>{{site.logo_text}}</span><small>EVENTS</small></a>
  <nav>
    <a href="{{url_for('index')}}">Inicio</a>
    <a href="{{url_for('eventos')}}">Eventos</a>
    <a href="{{url_for('galeria')}}">Galería</a>
    <a href="{{url_for('nosotros')}}">Nosotros</a>
  </nav>
  <a class="discord" href="{{site.discord_url}}" target="_blank">DISCORD ↗</a>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <div><b>{{site.site_name}}</b><br><span>{{site.footer_text}}</span></div>
  <a href="{{site.discord_url}}" target="_blank">ÚNETE A LA COMUNIDAD ↗</a>
</footer>
<script src="{{url_for('static',filename='js/main.js')}}"></script>
</body>
</html>
